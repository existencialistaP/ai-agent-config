bash:
  patterns:
    - match: git push *
      approval: prompt
      reason: push exige ação explícita do usuário
    - match: git * push *
      approval: prompt
      reason: push exige ação explícita do usuário
    - match: git reset --hard *
      approval: deny
      reason: descarta trabalho não commitado
    - match: git clean *
      approval: deny
      reason: apaga arquivos não rastreados
    - match: rm -rf *
      approval: deny
      reason: remoção recursiva forçada
    - match: rm -fr *
      approval: deny
      reason: remoção recursiva forçada
    - match: rm -r -f *
      approval: deny
      reason: remoção recursiva forçada
    - match: sudo *
      approval: deny
      reason: escalada de privilégio
